<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#101d32"/><title>Flip 7 Tracker</title><link rel="manifest" href="manifest.webmanifest"/><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f2f6ff;background:#0d1729}*{box-sizing:border-box}body{margin:0}main{max-width:900px;margin:auto;padding:20px 16px 70px}h1{margin:0;font-size:30px}h2{font-size:21px;margin:0 0 12px}.sub{color:#9fb2d0;font-size:13px}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.card{background:#172640;border:1px solid #2a4063;border-radius:18px;padding:17px;margin-bottom:14px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.button,button{cursor:pointer;background:#3c7eff;border:0;color:white;border-radius:11px;padding:11px 14px;font-size:14px;font-weight:700}button.secondary{background:#2a3d5e}button.danger{background:#7c3041}button:disabled{opacity:.45;cursor:not-allowed}input,select{background:#0d1a2f;color:white;border:1px solid #41587b;border-radius:10px;padding:11px;min-width:0;font:inherit}input[type=number]{width:95px}input[type=text]{width:100%}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#28476c;color:#d8e8ff;font-size:12px}.leader{color:#ffd56a}.player{padding:12px 0;border-top:1px solid #2c4263}.score{font-size:23px;font-weight:800}.muted{color:#9fb2d0}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1}.tabs .active{background:#3c7eff}.tabs button:not(.active){background:#263a59}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:#101e34;padding:13px;border-radius:12px}.stat b{font-size:23px;display:block;margin-top:5px}.small{font-size:12px}.hidden{display:none}.score-input{width:92px}.round-row{display:grid;grid-template-columns:minmax(85px,1fr) 100px auto auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid #2c4263}.switch{display:flex;align-items:center;gap:5px;font-size:12px}.switch input{width:18px;height:18px;accent-color:#3c7eff}.round-history{padding:9px 0;border-top:1px solid #2c4263}.error{color:#ff9d9d}.foot{font-size:12px;color:#9fb2d0;margin-top:20px}@media(max-width:520px){.round-row{grid-template-columns:minmax(75px,1fr) 84px auto auto;gap:5px}.round-row input[type=number]{width:80px}.round-row button{padding:9px}.card{padding:13px}.header{align-items:flex-start}}
</style></head><body><main><div class="header"><div><h1>⚡ Flip 7 Tracker</h1><div class="sub">Games, sessions & stats • saved on this device</div></div><button class="secondary" id="export">Export</button></div><div class="tabs"><button data-tab="play" class="active">Play</button><button data-tab="stats">Stats</button><button data-tab="history">History</button></div><div id="app"></div><div class="foot">Unofficial fan-made score tracker. Not affiliated with the Flip 7 publisher. Data is stored locally in this browser; export a backup regularly.</div><input id="import-file" type="file" accept="application/json" class="hidden"></main><script type="module">
const KEY='flip7-tracker-v1';const uid=()=>crypto.randomUUID();const initial=()=>({players:[],sessions:[],currentSession:null,currentGame:null});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}let tab='play';let draft={};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const session=()=>db.sessions.find(s=>s.id===db.currentSession);const game=()=>session()?.games.find(g=>g.id===db.currentGame);const pName=id=>db.players.find(p=>p.id===id)?.name||'Unknown';const totals=g=>Object.fromEntries(g.playerIds.map(id=>[id,g.rounds.reduce((sum,r)=>sum+(r.scores[id]?.points||0),0)]));const playerStats=(games,id)=>{let rounds=[],wins=0,played=0;for(const g of games){if(!g.playerIds.includes(id))continue;played++;const t=totals(g);if(g.finished&&t[id]===Math.max(...Object.values(t)))wins++;rounds.push(...g.rounds.map(r=>r.scores[id]||{points:0,flip:false}));}let since=0,longest=0,streak=0;for(const r of rounds){if(r.points<=0){streak++;longest=Math.max(longest,streak)}else streak=0;}for(let i=rounds.length-1;i>=0&&rounds[i].points<=0;i--)since++;return {played,wins,rounds:rounds.length,points:rounds.reduce((a,r)=>a+r.points,0),flips:rounds.filter(r=>r.flip).length,since,longest,best:rounds.length?Math.max(...rounds.map(r=>r.points)):0,average:rounds.length?Math.round(rounds.reduce((a,r)=>a+r.points,0)/rounds.length*10)/10:0};};const allGames=()=>db.sessions.flatMap(s=>s.games);function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('app').innerHTML=tab==='play'?playView():tab==='stats'?statsView():historyView();bind();}
function playView(){const s=session(),g=game();if(!s)return `<section class="card"><h2>Start a session</h2><p class="muted">A session contains multiple games with the same group of players.</p><form id="new-session"><input name="name" placeholder="Friday game night" required maxlength="80"><button>Start session</button></form></section>${db.sessions.length?`<section class="card"><h2>Resume a session</h2>${db.sessions.slice().reverse().map(x=>`<div class="player row between"><span>${esc(x.name)} <span class="sub">${x.games.length} games</span></span><button class="secondary" data-resume="${x.id}">Open</button></div>`).join('')}</section>`:''}`;if(!g)return `<section class="card"><div class="row between"><div><h2>${esc(s.name)}</h2><div class="sub">${s.games.length} game(s) in this session</div></div><button class="secondary" id="leave-session">Sessions</button></div><h2>Players</h2><form id="add-player" class="row"><input class="grow" name="name" placeholder="Player name" required maxlength="40"><button>Add</button></form>${db.players.map(p=>`<div class="player row between"><span>${esc(p.name)}</span><button class="secondary" data-remove-player="${p.id}" aria-label="Remove ${esc(p.name)}">Remove</button></div>`).join('')}<button id="start-game" ${db.players.length<2?'disabled':''}>Start game (${db.players.length} players)</button><p class="sub">Players are reused for each game. You can remove people before starting a new game.</p></section>${s.games.length?`<section class="card"><h2>Previous games</h2>${s.games.slice().reverse().map((g,i)=>`<div class="player row between"><span>Game ${s.games.length-i} • ${g.rounds.length} rounds ${g.finished?'✓':''}</span><button class="secondary" data-open-game="${g.id}">View</button></div>`).join('')}</section>`:''}`;const t=totals(g),ordered=g.playerIds.slice().sort((a,b)=>t[b]-t[a]);return `<section class="card"><div class="row between"><div><h2>${esc(s.name)}</h2><span class="pill">Game ${s.games.indexOf(g)+1} • ${g.rounds.length} rounds</span> ${g.finished?'<span class="pill">Finished</span>':''}</div><button class="secondary" id="back-games">Games</button></div>${ordered.map((id,i)=>`<div class="player row between"><div>${i===0?'🏆 ':''}<b class="${i===0?'leader':''}">${esc(pName(id))}</b><div class="sub">${playerStats([g],id).flips} Flip 7s • ${playerStats([g],id).since} rounds since scoring</div></div><div class="score">${t[id]}</div></div>`).join('')}</section>${!g.finished?`<section class="card"><h2>Round ${g.rounds.length+1}</h2><p class="sub">Enter the total round score. Use − for busts or deductions. Flip 7 is recorded separately; include any Flip 7 bonus in the entered score.</p>${g.playerIds.map(id=>`<div class="round-row"><b>${esc(pName(id))}</b><input aria-label="Score for ${esc(pName(id))}" data-score="${id}" type="number" min="0" step="1" value="${draft[id]?.value??0}"><button class="secondary" data-sign="${id}" aria-label="Toggle sign for ${esc(pName(id))}">${draft[id]?.negative?'−':'+'}</button><label class="switch"><input type="checkbox" data-flip="${id}" ${draft[id]?.flip?'checked':''}>Flip 7</label></div>`).join('')}<div class="row" style="margin-top:12px"><button id="save-round">Save round</button><button class="secondary" id="finish-game">Finish game</button></div></section>`:`<section class="card"><h2>Game complete</h2><button id="next-game">New game with same players</button></section>`}<section class="card"><div class="row between"><h2>Round history</h2>${g.rounds.length&&!g.finished?'<button class="danger" id="undo-round">Undo last round</button>':''}</div>${g.rounds.length?g.rounds.map((r,i)=>`<div class="round-history"><b>Round ${i+1}</b><div class="sub">${g.playerIds.map(id=>`${esc(pName(id))}: ${r.scores[id]?.points>0?'+':''}${r.scores[id]?.points||0}${r.scores[id]?.flip?' ⭐':''}`).join(' • ')}</div></div>`).join(''):'<p class="muted">No rounds yet.</p>'}</section>`;}
function statsView(){const s=session();const games=s?s.games:allGames();const ids=[...new Set(games.flatMap(g=>g.playerIds))];return `<section class="card"><h2>Player statistics</h2><p class="sub">${s?'Current session: '+esc(s.name):'All saved sessions'} • ${games.length} games</p>${ids.length?ids.map(id=>{const x=playerStats(games,id);return `<div class="player"><h2>${esc(pName(id))}</h2><div class="statgrid">${[['Points',x.points],['Flip 7s',x.flips],['Rounds since scoring',x.since],['Longest scoreless streak',x.longest],['Games won',x.wins],['Win rate',x.played?Math.round(x.wins/x.played*100)+'%':'0%'],['Best round',x.best],['Average / round',x.average]].map(([k,v])=>`<div class="stat"><span class="sub">${k}</span><b>${v}</b></div>`).join('')}</div></div>`}).join(''):'<p class="muted">Play a game to see statistics.</p>'}</section>`;}
function historyView(){return `<section class="card"><div class="row between"><h2>Saved sessions</h2><button class="secondary" id="import">Import backup</button></div>${db.sessions.length?db.sessions.slice().reverse().map(s=>`<div class="player row between"><div><b>${esc(s.name)}</b><div class="sub">${s.games.length} games • ${s.games.reduce((a,g)=>a+g.rounds.length,0)} rounds</div></div><button class="secondary" data-resume="${s.id}">Open</button></div>`).join(''):'<p class="muted">No sessions saved.</p>'}</section>`;}
function bind(){document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>{db.currentSession=b.dataset.resume;db.currentGame=null;draft={};save();tab='play';render()});document.querySelectorAll('[data-open-game]').forEach(b=>b.onclick=()=>{db.currentGame=b.dataset.openGame;draft={};save();render()});document.querySelectorAll('[data-remove-player]').forEach(b=>b.onclick=()=>{if(confirm('Remove this player from future games? Existing game history will be kept.')){db.players=db.players.filter(p=>p.id!==b.dataset.removePlayer);save();render()}});document.querySelectorAll('[data-score]').forEach(el=>el.oninput=()=>{draft[el.dataset.score]??={};draft[el.dataset.score].value=el.value});document.querySelectorAll('[data-flip]').forEach(el=>el.onchange=()=>{draft[el.dataset.flip]??={};draft[el.dataset.flip].flip=el.checked});document.querySelectorAll('[data-sign]').forEach(el=>el.onclick=()=>{draft[el.dataset.sign]??={};draft[el.dataset.sign].negative=!draft[el.dataset.sign].negative;el.textContent=draft[el.dataset.sign].negative?'−':'+'});if($('new-session'))$('new-session').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;let s={id:uid(),name,createdAt:new Date().toISOString(),games:[]};db.sessions.push(s);db.currentSession=s.id;db.currentGame=null;save();render()};if($('add-player'))$('add-player').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;if(db.players.some(p=>p.name.toLowerCase()===name.toLowerCase()))return alert('Player already exists');db.players.push({id:uid(),name});save();render()};if($('start-game'))$('start-game').onclick=()=>{let g={id:uid(),playerIds:db.players.map(p=>p.id),rounds:[],finished:false,createdAt:new Date().toISOString()};session().games.push(g);db.currentGame=g.id;draft={};save();render()};if($('save-round'))$('save-round').onclick=()=>{let scores={};for(const id of game().playerIds){const d=draft[id]||{};const n=Number(d.value??0);if(!Number.isSafeInteger(n)||n<0)return alert('Please enter non-negative whole numbers. Use the sign button for deductions.');scores[id]={points:n*(d.negative?-1:1),flip:!!d.flip};}game().rounds.push({id:uid(),scores});draft={};save();render()};if($('undo-round'))$('undo-round').onclick=()=>{if(confirm('Remove the most recent round?')){game().rounds.pop();save();render()}};if($('finish-game'))$('finish-game').onclick=()=>{if(!game().rounds.length)return alert('Enter at least one round first');if(confirm('Finish this game?')){game().finished=true;save();render()}};if($('next-game'))$('next-game').onclick=()=>{db.currentGame=null;save();render()};if($('back-games'))$('back-games').onclick=()=>{db.currentGame=null;save();render()};if($('leave-session'))$('leave-session').onclick=()=>{db.currentSession=null;save();render()};if($('import'))$('import').onclick=()=>$('import-file').click()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='flip7-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.players)||!Array.isArray(data.sessions))throw Error('Invalid backup');if(confirm('Replace all locally saved data with this backup?')){db=data;save();tab='play';render()}}catch(err){alert('Could not import: '+err.message)}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
