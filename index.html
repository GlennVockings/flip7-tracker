</style></head><body><main><div class="header"><div><h1>⚡ Flip 7 Tracker</h1><div class="sub">Games, sessions & stats • saved on this device</div></div><button class="secondary" id="export">Export</button></div><div class="tabs"><button data-tab="play" class="active">Play</button><button data-tab="stats">Stats</button><button data-tab="history">History</button></div><div id="app"></div><div class="foot">Unofficial fan-made score tracker. Not affiliated with the Flip 7 publisher. Data is stored locally in this browser; export a backup regularly.</div><input id="import-file" type="file" accept="application/json" class="hidden"></main><script type="module">
const KEY='flip7-tracker-v1';const uid=()=>crypto.randomUUID();const initial=()=>({players:[],sessions:[],currentSession:null,currentGame:null});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}let tab='play';let draft={};let showSummary=false;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const session=()=>db.sessions.find(s=>s.id===db.currentSession);const game=()=>session()?.games.find(g=>g.id===db.currentGame);const pName=id=>db.players.find(p=>p.id===id)?.name||'Unknown';const totals=g=>Object.fromEntries(g.playerIds.map(id=>[id,g.rounds.reduce((sum,r)=>sum+(r.scores[id]?.points||0),0)]));const playerStats=(games,id)=>{let rounds=[],wins=0,played=0;for(const g of games){if(!g.playerIds.includes(id))continue;played++;const t=totals(g);if(g.finished&&t[id]===Math.max(...Object.values(t)))wins++;rounds.push(...g.rounds.map(r=>r.scores[id]||{points:0,flip:false}));}let since=0,longest=0,streak=0;for(const r of rounds){if(r.points<=0){streak++;longest=Math.max(longest,streak)}else streak=0;}for(let i=rounds.length-1;i>=0&&rounds[i].points<=0;i--)since++;return {played,wins,rounds:rounds.length,points:rounds.reduce((a,r)=>a+r.points,0),flips:rounds.filter(r=>r.flip).length,since,longest,best:rounds.length?Math.max(...rounds.map(r=>r.points)):0,average:rounds.length?Math.round(rounds.reduce((a,r)=>a+r.points,0)/rounds.length*10)/10:0};};const allGames=()=>db.sessions.flatMap(s=>s.games);
const roster=s=>s.playerIds??s.games[0]?.playerIds??[];
const locked=s=>s.games.some(g=>g.rounds.length>0);
const mixed=s=>s.games.some(g=>g.playerIds.length!==roster(s).length||g.playerIds.some(id=>!roster(s).includes(id)));
const awards=s=>{const ids=roster(s),games=s.games,entries=ids.map(id=>({id,rounds:games.flatMap(g=>g.playerIds.includes(id)?g.rounds.map(r=>r.scores[id]||{points:0,flip:false}):[])}));if(!games.some(g=>g.rounds.length))return '';const rows=entries.map(e=>{let streak=0,longest=0;for(const r of e.rounds){streak=r.points<=0?streak+1:0;longest=Math.max(longest,streak)}return {...e,flips:e.rounds.filter(r=>r.flip).length,longest,positive:e.rounds.filter(r=>r.points>0).map(r=>r.points),best:e.rounds.length?Math.max(...e.rounds.map(r=>r.points)):null,wins:games.filter(g=>g.finished&&g.playerIds.includes(e.id)&&totals(g)[e.id]===Math.max(...Object.values(totals(g)))).length}});const definitions=[['Lowest positive round',r=>r.positive.length?Math.min(...r.positive):null,'min',' pts'],['Longest without points',r=>r.longest,'max',' rounds'],['Most Flip 7s',r=>r.flips,'max',''],['Least Flip 7s',r=>r.flips,'min',''],['Highest round',r=>r.best,'max',' pts'],['Most games won',r=>r.wins,'max','']];return `<div class="statgrid">${definitions.map(([label,fn,order,suffix])=>{const eligible=rows.map(r=>({id:r.id,value:fn(r)})).filter(r=>r.value!==null);if(!eligible.length)return `<div class="stat"><span class="sub">${label}</span><b>—</b></div>`;const record=order==='min'?Math.min(...eligible.map(r=>r.value)):Math.max(...eligible.map(r=>r.value));return `<div class="stat"><span class="sub">${label}</span><b style="font-size:17px">${eligible.filter(r=>r.value===record).map(r=>esc(pName(r.id))).join(', ')}</b><div class="sub">${record}${suffix}</div></div>`}).join('')}</div>`};const sessionRows=s=>{const ids=roster(s);return ids.map(id=>{const games=s.games.filter(g=>g.playerIds.includes(id));const rounds=games.flatMap(g=>g.rounds.map(r=>r.scores[id]||{points:0,flip:false}));let scoring=0,bestScoring=0,scoreless=0,bestScoreless=0,roundWins=0,last=0,comeback=0;for(const r of rounds){scoring=r.points>0?scoring+1:0;scoreless=r.points<=0?scoreless+1:0;bestScoring=Math.max(bestScoring,scoring);bestScoreless=Math.max(bestScoreless,scoreless)}for(const g of games){const t=totals(g);if(g.finished&&t[id]===Math.max(...Object.values(t)))roundWins+=0;let running=Object.fromEntries(g.playerIds.map(pid=>[pid,0]));let deficit=0;for(const r of g.rounds){for(const pid of g.playerIds)running[pid]+=(r.scores[pid]?.points||0);const lead=Math.max(...Object.values(running));deficit=Math.max(deficit,lead-running[id]);const highest=Math.max(...g.playerIds.map(pid=>r.scores[pid]?.points||0));if((r.scores[id]?.points||0)===highest&&highest>0)roundWins++}if(g.finished&&t[id]===Math.max(...Object.values(t)))comeback=Math.max(comeback,deficit)}return {id,scoring:bestScoring,scoreless:bestScoreless,roundWins,comeback,last:games.filter(g=>g.finished&&totals(g)[id]===Math.min(...Object.values(totals(g)))).length}})};
const extraAwards=s=>{if(!s.games.some(g=>g.rounds.length))return '';const rows=sessionRows(s);const defs=[['Biggest comeback',r=>r.comeback,' pts'],['Longest scoring streak',r=>r.scoring,' rounds'],['Most rounds won',r=>r.roundWins,' rounds'],['Most last-place finishes',r=>r.last,' games']];return `<div class="statgrid">${defs.map(([label,fn,suffix])=>{const record=Math.max(...rows.map(fn));return `<div class="stat"><span class="sub">${label}</span><b style="font-size:17px">${rows.filter(r=>fn(r)===record).map(r=>esc(pName(r.id))).join(', ')}</b><div class="sub">${record}${suffix}</div></div>`}).join('')}</div><p class="sub">Comeback: largest deficit overcome in a finished game win. Round wins include ties for highest positive score.</p>`};
const progression=s=>{const ids=roster(s),rounds=s.games.flatMap(g=>g.rounds);if(!rounds.length||!ids.length)return '<p class="muted">Play rounds to see score progression.</p>';const values=Object.fromEntries(ids.map(id=>[id,[0]]));for(const r of rounds)for(const id of ids)values[id].push(values[id].at(-1)+(r.scores[id]?.points||0));const all=Object.values(values).flat(),lo=Math.min(0,...all),hi=Math.max(1,...all),width=640,height=240,left=46,right=14,top=18,bottom=34,colors=['#6ca8ff','#ffcb6b','#8ee2b1','#f59cb2','#bca6ff','#65d9e6','#f7a46b'];const x=i=>left+(width-left-right)*i/Math.max(1,rounds.length),y=v=>top+(height-top-bottom)*(hi-v)/(hi-lo||1);return `<div class="chart-scroll"><svg role="img" aria-label="Cumulative points by round" viewBox="0 0 ${width} ${height}" style="width:100%;min-width:360px;display:block">${[0,.25,.5,.75,1].map(k=>{const val=lo+(hi-lo)*k,yy=y(val);return `<line x1="${left}" y1="${yy}" x2="${width-right}" y2="${yy}" stroke="#36506e" stroke-dasharray="3 4"/><text x="${left-6}" y="${yy+4}" fill="#b7c9e5" text-anchor="end" font-size="11">${Math.round(val)}</text>`}).join('')}${ids.map((id,i)=>`<polyline points="${values[id].map((v,j)=>`${x(j)},${y(v)}`).join(' ')}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`).join('')}<text x="${width/2}" y="${height-5}" text-anchor="middle" fill="#b7c9e5" font-size="12">Rounds (${rounds.length})</text></svg></div><div class="row" style="margin-top:12px">${ids.map((id,i)=>`<span class="pill"><span style="color:${colors[i%colors.length]}">●</span> ${esc(pName(id))}: ${values[id].at(-1)}</span>`).join('')}</div><p class="sub">Cumulative points across all games in this session; game totals reset for each new game, but the chart keeps running.</p>`};
const summary=s=>{const ids=roster(s);const completed=s.games.filter(g=>g.finished),rounds=s.games.reduce((a,g)=>a+g.rounds.length,0);const pts=Object.fromEntries(ids.map(id=>[id,s.games.reduce((sum,g)=>sum+(g.playerIds.includes(id)?totals(g)[id]:0),0)]));const wins=Object.fromEntries(ids.map(id=>[id,completed.filter(g=>g.playerIds.includes(id)&&totals(g)[id]===Math.max(...Object.values(totals(g)))).length]));const sorted=ids.slice().sort((a,b)=>wins[b]-wins[a]||pts[b]-pts[a]);return `<section class="card"><div class="row between"><div><h2>Session summary</h2><p class="sub">${esc(s.name)} • ${s.games.length} games (${completed.length} finished) • ${rounds} rounds</p></div><button class="secondary" id="summary-back">Back</button></div>${sorted.map((id,i)=>`<div class="player row between"><div>${i===0?'🏆 ':''}<b>${esc(pName(id))}</b><div class="sub">${wins[id]} wins • ${playerStats(s.games,id).flips} Flip 7s</div></div><b>${pts[id]} pts</b></div>`).join('')}${!rounds?'<p class="muted">No rounds yet.</p>':''}</section>${mixed(s)?'<section class="card"><p class="error">This older session has different player rosters; awards and chart are unavailable.</p></section>':`<section class="card"><h2>Score progression</h2>${progression(s)}</section><section class="card"><h2>Session awards</h2>${awards(s)}<h2 style="margin-top:20px">More awards</h2>${extraAwards(s)}</section>`}`};
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('app').innerHTML=showSummary&&session()?summary(session()):tab==='play'?playView():tab==='stats'?statsView():historyView();bind();}
function playView(){const s=session(),g=game();if(!s)return `<section class="card"><h2>Start a session</h2><p class="muted">A session contains multiple games with the same group of players.</p><form id="new-session"><input name="name" placeholder="Friday game night" required maxlength="80"><button>Start session</button></form></section>${db.sessions.length?`<section class="card"><h2>Resume a session</h2>${db.sessions.slice().reverse().map(x=>`<div class="player row between"><span>${esc(x.name)} <span class="sub">${x.games.length} games</span></span><button class="secondary" data-resume="${x.id}">Open</button></div>`).join('')}</section>`:''}`;if(!g)return `<section class="card"><div class="row between"><div><h2>${esc(s.name)}</h2><div class="sub">${s.games.length} game(s) in this session</div></div><div class="row"><button class="secondary" id="leave-session">Sessions</button><button class="secondary" id="show-summary">Summary</button><button class="danger" data-delete-session="${s.id}">Delete session</button></div></div><h2>Players</h2><form id="add-player" class="row"><input class="grow" name="name" placeholder="Player name" required maxlength="40"><button ${locked(s)?'disabled':''}>Add</button></form>${roster(s).map(id=>db.players.find(p=>p.id===id)).filter(Boolean).map(p=>`<div class="player row between"><span>${esc(p.name)}</span>${locked(s)?'':`<button class="secondary" data-remove-player="${p.id}" aria-label="Remove ${esc(p.name)}">Remove</button>`}</div>`).join('')}<button id="start-game" ${roster(s).length<2?'disabled':''}>Start game (${roster(s).length} players)</button><p class="sub">${locked(s)?'Roster locked after the first saved round.':'You can adjust players until the first round is saved.'}</p></section>${s.games.length?`<section class="card"><h2>Previous games</h2>${s.games.slice().reverse().map((g,i)=>`<div class="player row between"><span>Game ${s.games.length-i} • ${g.rounds.length} rounds ${g.finished?'✓':''}</span><button class="secondary" data-open-game="${g.id}">View</button></div>`).join('')}</section>`:''}`;const t=totals(g),ordered=g.playerIds.slice().sort((a,b)=>t[b]-t[a]);return `<section class="card"><div class="row between"><div><h2>${esc(s.name)}</h2><span class="pill">Game ${s.games.indexOf(g)+1} • ${g.rounds.length} rounds</span> ${g.finished?'<span class="pill">Finished</span>':''}</div><button class="secondary" id="back-games">Games</button></div>${ordered.map((id,i)=>`<div class="player row between"><div>${i===0?'🏆 ':''}<b class="${i===0?'leader':''}">${esc(pName(id))}</b><div class="sub">${playerStats([g],id).flips} Flip 7s • ${playerStats([g],id).since} rounds since scoring</div></div><div class="score">${t[id]}</div></div>`).join('')}</section>${!g.finished?`<section class="card"><h2>Round ${g.rounds.length+1}</h2><p class="sub">Enter the total round score. Use − for busts or deductions. Flip 7 is recorded separately; include any Flip 7 bonus in the entered score.</p>${g.playerIds.map(id=>`<div class="round-row"><b>${esc(pName(id))}</b><input aria-label="Score for ${esc(pName(id))}" data-score="${id}" type="number" min="0" step="1" value="${draft[id]?.value??0}"><button class="secondary" data-sign="${id}" aria-label="Toggle sign for ${esc(pName(id))}">${draft[id]?.negative?'−':'+'}</button><label class="switch"><input type="checkbox" data-flip="${id}" ${draft[id]?.flip?'checked':''}>Flip 7</label></div>`).join('')}<div class="row" style="margin-top:12px"><button id="save-round">Save round</button><button class="secondary" id="finish-game">Finish game</button></div></section>`:`<section class="card"><h2>Game complete</h2><button id="next-game">New game with same players</button></section>`}<section class="card"><div class="row between"><h2>Round history</h2>${g.rounds.length&&!g.finished?'<button class="danger" id="undo-round">Undo last round</button>':''}</div>${g.rounds.length?g.rounds.map((r,i)=>`<div class="round-history"><b>Round ${i+1}</b><div class="sub">${g.playerIds.map(id=>`${esc(pName(id))}: ${r.scores[id]?.points>0?'+':''}${r.scores[id]?.points||0}${r.scores[id]?.flip?' ⭐':''}`).join(' • ')}</div></div>`).join(''):'<p class="muted">No rounds yet.</p>'}</section>`;}
function statsView(){const s=session();const games=s?s.games:allGames();const ids=[...new Set(games.flatMap(g=>g.playerIds))];return `<section class="card"><h2>Player statistics</h2><p class="sub">${s?'Current session: '+esc(s.name):'All saved sessions'} • ${games.length} games</p>${ids.length?ids.map(id=>{const x=playerStats(games,id);return `<div class="player"><h2>${esc(pName(id))}</h2><div class="statgrid">${[['Points',x.points],['Flip 7s',x.flips],['Rounds since scoring',x.since],['Longest scoreless streak',x.longest],['Games won',x.wins],['Win rate',x.played?Math.round(x.wins/x.played*100)+'%':'0%'],['Best round',x.best],['Average / round',x.average]].map(([k,v])=>`<div class="stat"><span class="sub">${k}</span><b>${v}</b></div>`).join('')}</div></div>`}).join(''):'<p class="muted">Play a game to see statistics.</p>'}${s?`<h2 style="margin-top:22px">Session awards</h2>${mixed(s)?'<p class="error">Different rosters detected in older games; awards are unavailable for this session.</p>':awards(s)}`:''}</section>`;}
function historyView(){return `<section class="card"><div class="row between"><h2>Saved sessions</h2><button class="secondary" id="import">Import backup</button></div>${db.sessions.length?db.sessions.slice().reverse().map(s=>`<div class="player row between"><div><b>${esc(s.name)}</b><div class="sub">${s.games.length} games • ${s.games.reduce((a,g)=>a+g.rounds.length,0)} rounds</div></div><div class="row"><button class="secondary" data-summary="${s.id}">Summary</button><button class="secondary" data-resume="${s.id}">Open</button><button class="danger" data-delete-session="${s.id}">Delete</button></div></div>`).join(''):'<p class="muted">No sessions saved.</p>'}</section>`;}
function bind(){if($('show-summary'))$('show-summary').onclick=()=>{showSummary=true;render()};if($('summary-back'))$('summary-back').onclick=()=>{showSummary=false;tab='play';render()};document.querySelectorAll('[data-summary]').forEach(b=>b.onclick=()=>{db.currentSession=b.dataset.summary;db.currentGame=null;showSummary=true;save();render()});document.querySelectorAll('[data-delete-session]').forEach(b=>b.onclick=()=>{const id=b.dataset.deleteSession,record=db.sessions.find(s=>s.id===id);if(record&&confirm(`Permanently delete session \"${record.name}\" and all its games and rounds? This cannot be undone.`)){db.sessions=db.sessions.filter(s=>s.id!==id);const referenced=new Set(db.sessions.flatMap(s=>[...(s.playerIds||[]),...s.games.flatMap(g=>g.playerIds)]));db.players=db.players.filter(p=>referenced.has(p.id));if(db.currentSession===id){db.currentSession=null;db.currentGame=null}save();render()}});document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>{db.currentSession=b.dataset.resume;db.currentGame=null;showSummary=false;draft={};save();tab='play';render()});document.querySelectorAll('[data-open-game]').forEach(b=>b.onclick=()=>{db.currentGame=b.dataset.openGame;draft={};save();render()});document.querySelectorAll('[data-remove-player]').forEach(b=>b.onclick=()=>{if(confirm('Remove this player from future games? Existing game history will be kept.')){if(locked(session()))return alert('The roster is locked after the first round.');session().playerIds=roster(session()).filter(id=>id!==b.dataset.removePlayer);session().games.filter(g=>!g.rounds.length).forEach(g=>g.playerIds=[...session().playerIds]);save();render()}});document.querySelectorAll('[data-score]').forEach(el=>el.oninput=()=>{draft[el.dataset.score]??={};draft[el.dataset.score].value=el.value});document.querySelectorAll('[data-flip]').forEach(el=>el.onchange=()=>{draft[el.dataset.flip]??={};draft[el.dataset.flip].flip=el.checked});document.querySelectorAll('[data-sign]').forEach(el=>el.onclick=()=>{draft[el.dataset.sign]??={};draft[el.dataset.sign].negative=!draft[el.dataset.sign].negative;el.textContent=draft[el.dataset.sign].negative?'−':'+'});if($('new-session'))$('new-session').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;let s={id:uid(),name,createdAt:new Date().toISOString(),playerIds:[],games:[]};db.sessions.push(s);db.currentSession=s.id;db.currentGame=null;showSummary=false;save();render()};if($('add-player'))$('add-player').onsubmit=e=>{e.preventDefault();let name=new FormData(e.target).get('name').trim();if(!name)return;if(roster(session()).some(id=>pName(id).toLocaleLowerCase()===name.toLocaleLowerCase()))return alert('Player already exists in this session');if(locked(session()))return alert('The roster is locked after the first round.');const id=uid();db.players.push({id,name});session().playerIds=roster(session()).concat(id);session().games.filter(g=>!g.rounds.length).forEach(g=>g.playerIds=[...session().playerIds]);save();render()};if($('start-game'))$('start-game').onclick=()=>{let g={id:uid(),playerIds:[...roster(session())],rounds:[],finished:false,createdAt:new Date().toISOString()};session().games.push(g);db.currentGame=g.id;draft={};save();render()};if($('save-round'))$('save-round').onclick=()=>{if(!session().playerIds)session().playerIds=[...game().playerIds];let scores={};for(const id of game().playerIds){const d=draft[id]||{};const n=Number(d.value??0);if(!Number.isSafeInteger(n)||n<0)return alert('Please enter non-negative whole numbers. Use the sign button for deductions.');scores[id]={points:n*(d.negative?-1:1),flip:!!d.flip};}game().rounds.push({id:uid(),scores});draft={};save();render()};if($('undo-round'))$('undo-round').onclick=()=>{if(confirm('Remove the most recent round?')){game().rounds.pop();save();render()}};if($('finish-game'))$('finish-game').onclick=()=>{if(!game().rounds.length)return alert('Enter at least one round first');if(confirm('Finish this game?')){game().finished=true;save();render()}};if($('next-game'))$('next-game').onclick=()=>{db.currentGame=null;save();render()};if($('back-games'))$('back-games').onclick=()=>{db.currentGame=null;save();render()};if($('leave-session'))$('leave-session').onclick=()=>{db.currentSession=null;showSummary=false;save();render()};if($('import'))$('import').onclick=()=>$('import-file').click()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;showSummary=false;render()});$('export').onclick=()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='flip7-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.players)||!Array.isArray(data.sessions))throw Error('Invalid backup');if(confirm('Replace all locally saved data with this backup?')){db=data;save();tab='play';render()}}catch(err){alert('Could not import: '+err.message)}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
